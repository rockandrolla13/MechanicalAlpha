version: 0.1.0
status: deterministic_formula_registry
side_convention:
  canonical: customer_perspective
  customer_buy: 1
  customer_sell: -1
  trace_warning: TRACE side must come from a documented source or validated classifier before being treated as observed customer side.
point_in_time_rule:
  feature_observation_cutoff: observation_timestamp < prediction_timestamp
  same_timestamp_policy: exclude
features:
  - id: A1
    name: RFQ count imbalance
    formula: "(w_buy * buy_measure_w - w_sell * sell_measure_w) / (w_buy * buy_measure_w + w_sell * sell_measure_w + epsilon)"
    source_fields:
      - rfqs.timestamp
      - rfqs.side
      - rfqs.cr01
      - rfqs.event_kind
      - events.prediction_timestamp
      - events.side
      - events.cr01
    clocks:
      - calendar_time
      - rfq_event_time
      - trace_transaction_time
    windows:
      - configurable_calendar_windows
      - last_5
      - last_10
      - last_25
    measures:
      - count
      - cr01
    fitted_parameters:
      - buy_weight
      - sell_weight
    side_weight_mode: inverse_market_share
    minimum_observations: 1
    missing_policy: Missing when the source table, valid side, or requested risk measure is unavailable.
    expected_sign: Positive means recent customer-buy pressure after adjusting for market side drift.
    class: directional
    point_in_time_dependencies:
      - source event time strictly before prediction timestamp
      - side weights fitted on training rows only
    computational_cost: O(prediction_rows * window_rows)
    version: 0.2.0
  - id: A2
    name: RFQ notional imbalance
    formula: "sum(w_side * customer_side_j * transformed_risk_j) / (sum(w_side * abs(transformed_risk_j)) + epsilon)"
    source_fields:
      - rfqs.timestamp
      - rfqs.side
      - rfqs.size
      - rfqs.cr01
      - events.prediction_timestamp
      - events.side
      - events.notional
      - events.cr01
    clocks:
      - calendar_time
      - rfq_event_time
      - trace_transaction_time
    windows:
      - 30m
      - 2h
      - last_5
      - last_10
      - last_25
    variants:
      - raw_risk
      - log_risk
      - capped_risk
      - sqrt_risk
    measures:
      - cr01
      - notional
    fitted_parameters:
      - buy_weight
      - sell_weight
    side_weight_mode: inverse_market_share
    minimum_observations: 1
    missing_policy: Missing when side or requested risk measure is unavailable; CR01 is not silently replaced with notional.
    expected_sign: Positive means larger recent customer-buy traded credit risk after adjusting for market side drift.
    class: directional
    point_in_time_dependencies:
      - source event time strictly before prediction timestamp
      - side weights fitted on training rows only
      - transform caps use only the configured fitting/window policy
    computational_cost: O(prediction_rows * window_rows)
    version: 0.2.0
  - id: A3
    name: Buy/sell intensity pressure
    formula: train-selected elapsed-time EWMA count and CR01 intensities compared with frozen empirical baselines
    source_fields:
      - rfqs.timestamp
      - rfqs.side
      - rfqs.cr01
      - events.prediction_timestamp
      - events.side
      - events.cr01
    clocks:
      - calendar_time
      - cr01_activity
    windows:
      - 1d_half_life
      - 2d_half_life
      - 5d_half_life
      - 10d_half_life
      - 20d_half_life
      - 40d_half_life
    fitted_parameters:
      - selected_buy_half_life
      - selected_sell_half_life
      - buy_baseline_intensity_per_second
      - sell_baseline_intensity_per_second
      - selected_buy_cr01_half_life
      - selected_sell_cr01_half_life
      - buy_baseline_cr01_per_second
      - sell_baseline_cr01_per_second
    minimum_observations: 1
    missing_policy: Missing when no prior observations exist; CR01 clocks are missing when event-level CR01 is absent; fitted baseline falls back to pooled empirical rates when sparse.
    expected_sign: Higher buy-minus-sell surprise means abnormal customer-buy arrival pressure or abnormal customer-buy CR01 risk flow.
    class: directional
    point_in_time_dependencies:
      - source event time strictly before prediction timestamp
      - EWMA weights use elapsed time
      - half-life and baselines fitted on training rows only, with RFQ CR01 as the primary fitted risk clock when available
    computational_cost: O(prediction_rows * prior_rows)
    version: 0.3.0
  - id: A4
    name: Last-side persistence and switching state
    formula: last side, run length, time since side change, same-side fractions, interactions, and switching hazard
    source_fields:
      - rfqs.timestamp
      - rfqs.side
      - events.prediction_timestamp
      - events.side
    clocks:
      - rfq_event_time
      - trace_transaction_time
    windows:
      - last_5
      - last_10
      - last_25
    minimum_observations: 1
    missing_policy: Missing when no prior valid-side observations exist.
    expected_sign: Positive last side means the latest observable side was customer buy.
    class: directional
    point_in_time_dependencies:
      - source event time strictly before prediction timestamp
    computational_cost: O(prediction_rows * window_rows)
    version: 0.1.0
  - id: A5
    name: Multi-clock activity surprise
    formula: observed activity minus frozen train-period population baseline, standardized by fitted residual scale
    source_fields:
      - rfqs.timestamp
      - rfqs.size
      - rfqs.dv01
      - rfqs.cr01
      - events.prediction_timestamp
      - events.notional
      - events.dv01
      - events.cr01
      - bonds.issuer_id
    clocks:
      - calendar_time
      - rfq_event_time
      - trace_transaction_time
    windows:
      - 1d
      - 3d
      - 5d
      - 10d
      - 20d
      - 40d
      - 60d
      - 120d
      - last_5
      - last_10
      - last_25
      - last_50
    horizon_families:
      fast:
        calendar_windows: [1d, 3d]
        rfq_event_windows: [5, 10]
        trade_event_windows: [5, 10]
      slow:
        calendar_windows: [5d, 10d, 20d, 40d, 60d, 120d]
        rfq_event_windows: [25, 50]
        trade_event_windows: [25, 50]
        refit_frequency: monthly
    minimum_observations: 3
    missing_policy: Missing with quality flags when the source, DV01, CR01, or frozen baseline is unavailable.
    expected_sign: Positive means bond or issuer activity is above its frozen population baseline.
    class: liquidity
    point_in_time_dependencies:
      - source event time strictly before prediction timestamp
      - model fit uses training rows only
      - validation and test rows cannot change frozen fitted baselines
      - static bond DV01 or CR01 is used only with an explicit unit policy
    computational_cost: O(prediction_rows * selected_windows * event_types)
    version: 0.3.0
  - id: A6
    name: Spread-conditioned flow pressure
    formula: fast and slow notional/CR01 flow pressure interacted with latest as-of composite spread, spread percentile, asymmetry, disagreement, staleness, and liquidity bucket
    source_fields:
      - quotes.timestamp
      - quotes.bid
      - quotes.ask
      - quotes.mid
      - quotes.spread
      - events.side
      - events.notional
      - events.cr01
      - bonds.liquidity_bucket
    clocks:
      - calendar_time
      - trace_transaction_time
    windows:
      - latest_quote_before_timestamp
      - fast_1d
      - fast_3d
      - fast_last_5
      - fast_last_10
      - slow_5d
      - slow_10d
      - slow_20d
      - slow_40d
      - slow_60d
      - slow_120d
      - slow_last_25
      - slow_last_50
    horizon_families:
      fast:
        calendar_windows: [1d, 3d]
        trade_event_windows: [5, 10]
      slow:
        calendar_windows: [5d, 10d, 20d, 40d, 60d, 120d]
        trade_event_windows: [25, 50]
        refit_frequency: monthly
    fitted_model:
      default_type: ridge
      optional_type: elastic_net
      default_targets:
        - future_clean_price_move
        - future_issuer_residual_move
      frozen_parameters:
        - feature_columns
        - feature_means
        - feature_scales
        - coefficients
        - intercept
    minimum_observations: 1
    missing_policy: Missing for unavailable quote fields; CR01 flow is missing when event-level CR01 is absent.
    expected_sign: Positive flow with wide or stale spreads flags directional risk pressure under weaker liquidity.
    class: liquidity
    point_in_time_dependencies:
      - quote timestamp strictly before prediction timestamp
      - flow events strictly before prediction timestamp
    computational_cost: O(prediction_rows * quote_rows + window_rows)
    version: 0.2.0
  - id: A16
    name: RFQ scarcity and disagreement
    formula: fast and slow responder scarcity, quote dispersion, latency, no-response rate, firm-up rate, execution rate, and latest executable indication age
    source_fields:
      - rfqs.timestamp
      - rfqs.number_of_dealers
      - rfqs.response_count
      - rfqs.response_latency_ms
      - rfqs.responded
      - rfqs.firmed_up
      - rfqs.executed
    clocks:
      - rfq_event_time
      - calendar_time
    windows:
      - latest_rfq_before_timestamp
      - fast_1d
      - fast_3d
      - fast_last_5
      - fast_last_10
      - slow_5d
      - slow_10d
      - slow_20d
      - slow_40d
      - slow_60d
      - slow_120d
      - last_25
      - slow_last_50
    horizon_families:
      fast:
        calendar_windows: [1d, 3d]
        rfq_event_windows: [5, 10]
      slow:
        calendar_windows: [5d, 10d, 20d, 40d, 60d, 120d]
        rfq_event_windows: [25, 50]
        refit_frequency: monthly
    fitted_model:
      default_type: logistic_regression
      fallback_type: constant_probability
      default_targets:
        - responded
        - firmed_up
        - executed
      frozen_parameters:
        - feature_columns
        - feature_means
        - feature_scales
        - coefficients
        - intercept
        - positive_rate
    minimum_observations: 1
    missing_policy: Missing for RFQ fields absent from the canonical RFQ table.
    expected_sign: Higher scarcity or disagreement means worse liquidity and more uncertainty.
    class: liquidity
    point_in_time_dependencies:
      - RFQ timestamp strictly before prediction timestamp
    computational_cost: O(prediction_rows * window_rows)
    version: 0.2.0
